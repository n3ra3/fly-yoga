name: Backup database

# Ежедневный бэкап базы Supabase.
# Делает дамп (pg_dump), шифрует его AES-256 и сохраняет как приватный
# артефакт GitHub (доступен только тем, у кого есть доступ к репозиторию;
# к тому же зашифрован — без пароля не открыть).
#
# Нужны ДВА секрета репозитория (Settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL    — строка подключения "Session pooler" из Supabase
#                        (Project Settings → Database → Connection string →
#                         Session pooler / Session mode), вместе с паролем БД.
#                        Важно: именно pooler (IPv4), а не Direct connection.
#   BACKUP_PASSPHRASE  — придуманный тобой надёжный пароль для расшифровки.
#                        СОХРАНИ его в менеджере паролей — без него бэкап не открыть!
#
# Побочный плюс: этот дамп ежедневно «будит» базу — работает и как keep-alive.

on:
  schedule:
    - cron: '0 3 * * *' # каждый день в 03:00 UTC (~05:00–06:00 в Кишинёве)
  workflow_dispatch: {} # можно запустить вручную из вкладки Actions

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Установить pg_dump 17
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Сделать дамп и зашифровать
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          STAMP=$(date -u +%Y-%m-%d_%H%M)
          FILE="flyyoga-${STAMP}.dump"
          # -Fc = сжатый формат для pg_restore; данные приложения + аккаунты
          pg_dump "$DB_URL" \
            --no-owner --no-privileges \
            --schema=public --schema=auth --schema=storage \
            -Fc -f "$FILE"
          gpg --batch --yes --symmetric --cipher-algo AES256 \
            --passphrase "$PASSPHRASE" -o "${FILE}.gpg" "$FILE"
          rm -f "$FILE"
          ls -lh "${FILE}.gpg"
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"

      - name: Загрузить бэкап
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ env.STAMP }}
          path: '*.dump.gpg'
          retention-days: 90
          if-no-files-found: error
