name: Supabase keep-alive

# Бесплатный Supabase засыпает после 7 дней без активности.
# Этот воркфлоу раз в день делает лёгкий запрос к базе и сбрасывает таймер.
# Нужны два секрета репозитория (Settings → Secrets and variables → Actions):
#   SUPABASE_URL       — https://ВАШ-ПРОЕКТ.supabase.co
#   SUPABASE_ANON_KEY  — публичный anon-ключ (тот же, что в .env)

on:
  schedule:
    - cron: '17 6 * * *' # каждый день в 06:17 UTC
  workflow_dispatch: {}   # можно запустить вручную из вкладки Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/classes?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "Supabase responded with HTTP $code"
          if [ "$code" -ge 500 ] || [ "$code" -eq 000 ]; then
            echo "Keep-alive ping failed"; exit 1
          fi
